<!doctype html>
<!-- Раскладка окна — по лаунчеру разработчиков (Lattymoy/daggerfall-js-source,
     MIT): шапка-вордмарк + ссылки, боковая колонка, нижний статус-бар.
     Код свой: мост window.ruUpdater, тексты только через textContent. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self' data:">
<title>Обновление перевода</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="launcher">
  <header class="top">
    <h1 class="wordmark">Daggerfall<small>Online</small></h1>
    <p class="unofficial">Неофициальный лаунчер русской локализации</p>
    <nav class="links" aria-label="Ссылки">
      <button class="link" type="button" data-open="site">daggerfalljs.dev</button>
      <button class="link" type="button" data-open="discord">Discord</button>
    </nav>
  </header>
  <div class="rule" aria-hidden="true"></div>

  <div class="middle">
    <main class="panel">
      <section id="banner" class="banner" hidden>
        <p id="banner-title"></p>
        <p id="banner-detail"></p>
        <button id="banner-install" class="plaque primary" type="button">Установить</button>
      </section>
      <section class="opt">
        <h2>Пак перевода</h2>
        <p id="game">Игра: …</p>
        <p id="installed">Установлен: …</p>
        <div class="row">
          <button id="check" class="plaque" type="button">Проверить обновления</button>
          <button id="rollback" class="plaque" type="button">Откатить</button>
        </div>
      </section>
    </main>

    <aside class="side" aria-label="Настройки">
      <section class="opt">
        <h3>Обновления</h3>
        <label class="check"><input id="auto-check" type="checkbox"> Проверять автоматически</label>
      </section>
      <section class="opt">
        <h3>Приватность</h3>
        <p class="privacy">Приложение только скачивает список паков и сам пак — и только
        когда ты нажимаешь кнопку (или включил автопроверку). Ничего о тебе никуда
        не отправляется.</p>
      </section>
    </aside>
  </div>

  <footer class="bar">
    <p id="status" role="status"></p>
    <span id="version"></span>
  </footer>
</div>
<script src="./app.js"></script>
</body>
</html>
