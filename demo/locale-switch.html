<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>RU-pack: переключатель языка (демо)</title>
<style>
  @font-face { font-family: 'Handjet'; font-weight: 400; font-display: swap;
    src: url('../vendor/handjet/handjet-cyrillic-400-normal.woff2') format('woff2');
    unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
  body { font-family: 'Handjet','Pixelify Sans',monospace; background: #14110d; color: #e9e4d9; }
  button { font: inherit; padding: 6px 12px; cursor: pointer; }
</style>
</head>
<body>
<h1 id="title">...</h1>
<p>Шрифт: Кк Ыы Жж Ээ Юю — Стальной меч, 15 Января</p>
<p><button id="ru">Русский</button> <button id="en">English</button></p>
<p id="line">...</p>
<!--
  Самодостаточный файл: открывается двойным кликом (file://).
  ES-модули и import'ы тут запрещены — Chrome режет их CORS на file://.
  Логика повторяет src/locale/locale.js + morph.js на встроенном подмножестве.
-->
<script>
  var T = {
    en: { strings: { youSee: 'You see %s.' }, items: { 1: 'Emerald' } },
    ru: { strings: { youSee: 'Это %s.' }, items: { 1: 'Изумруд' } }
  };
  var MONTH_GEN = ['Января','Февраля','Марта','Апреля','Мая','Июня','Июля','Августа','Сентября','Октября','Ноября','Декабря'];
  var cur = 'ru';
  function setLocale(l) { cur = T[l] ? l : 'en'; }
  function t(table, key, v) {
    var s = (T[cur][table] && T[cur][table][key]) || (T.en[table] && T.en[table][key]) || key;
    return String(s).replaceAll('%s', v);
  }
  function paint() {
    document.getElementById('title').textContent =
      cur === 'ru' ? 'Русская локализация' : 'Russian localization';
    document.getElementById('line').textContent =
      t('strings', 'youSee', t('items', '1', '')) + ' — 15 ' + MONTH_GEN[0];
  }
  document.getElementById('ru').onclick = function () { setLocale('ru'); paint(); };
  document.getElementById('en').onclick = function () { setLocale('en'); paint(); };
  setLocale('ru'); paint();
</script>
</body>
</html>
