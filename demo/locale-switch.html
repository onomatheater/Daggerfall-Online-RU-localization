<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>RU-pack: переключатель языка (демо)</title>
<style>
  @font-face { font-family: 'Handjet'; font-weight: 400; font-display: swap;
    src: url('../vendor/handjet/handjet-cyrillic-400-normal.woff2') format('woff2');
    unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
  body { font-family: 'Handjet','Pixelify Sans',monospace; background: #14110d; color: #e9e4d9; }
  button { font: inherit; padding: 6px 12px; cursor: pointer; }
</style>
</head>
<body>
<h1 id="title">...</h1>
<p>Шрифт: Кк Ыы Жж Ээ Юю — Стальной меч, 15 Января</p>
<p><button id="ru">Русский</button> <button id="en">English</button></p>
<p id="line">...</p>
<script type="module">
  import { t, setLocale, getLocale } from '../src/locale/locale.js';
  import { month } from '../src/locale/morph.js';
  const paint = () => {
    document.getElementById('title').textContent =
      getLocale() === 'ru' ? 'Русская локализация' : 'Russian localization';
    document.getElementById('line').textContent =
      t('youSee', { s: t('items:1') }) + ' — 15 ' + month(0, 'gen');
  };
  document.getElementById('ru').onclick = () => { setLocale('ru'); paint(); };
  document.getElementById('en').onclick = () => { setLocale('en'); paint(); };
  setLocale('ru'); paint();
</script>
</body>
</html>
